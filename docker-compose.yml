services:
  api:
    container_name: healthmind-api-dev
    build:
      context: .
    ports:
      - '${PORT:-3333}:${PORT:-3333}'
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3333}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/healthmind
      - JWT_SECRET=${JWT_SECRET:-change_me}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - healthmind-network

  postgres:
    container_name: healthmind-postgres-dev
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthmind
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - healthmind-network

volumes:
  postgres-data:

networks:
  healthmind-network:
    driver: bridge
